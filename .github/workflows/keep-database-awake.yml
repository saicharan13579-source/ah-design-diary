name: Keep database awake
# Supabase pauses free projects after 7 days without traffic. This pings it twice a day.
on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js)
          curl -sS -o /dev/null -w "%{http_code}\n" "$URL/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          curl -sS -o /dev/null -w "%{http_code}\n" "$URL/auth/v1/health" -H "apikey: $KEY"
