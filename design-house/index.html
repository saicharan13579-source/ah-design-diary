<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ankura Design House</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: project tiles on the home page; each project opens to one sheet with three tabs: Timeline, Drawings, Team */
:root{
  --bg:#f3f2ec; --paper:#fbfaf6; --ink:#1d2219; --muted:#636a5a; --line:#dcdbd0; --track:#e8e7de;
  --accent:#3f6b2e; --accent-soft:#e3ebd9; --warn:#b4541c; --warn-soft:#f7e3d6; --due:#b9c2ad; --info:#2f5d7a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151812; --paper:#1d211a; --ink:#e7e9df; --muted:#9ba393; --line:#33382d; --track:#272c22;
  --accent:#9cc47f; --accent-soft:#26331f; --warn:#ec9a62; --warn-soft:#3b2519; --due:#4d5644; --info:#8fbcd8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151812; --paper:#1d211a; --ink:#e7e9df; --muted:#9ba393; --line:#33382d; --track:#272c22;
  --accent:#9cc47f; --accent-soft:#26331f; --warn:#ec9a62; --warn-soft:#3b2519; --due:#4d5644; --info:#8fbcd8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

header{display:grid;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 a{text-decoration:none}

/* home tiles */
.tiles{display:grid;gap:10px}
.tile{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr) 20px;gap:24px;align-items:center;padding:18px 20px;background:var(--paper);border:1px solid var(--line);text-decoration:none;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
.tile .nm h2{font-family:var(--f-display);font-size:26px;line-height:1.05;margin:0}
.tile .nm span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.tile .go{color:var(--muted);transition:transform .15s,color .15s}
.tile:hover .go{transform:translateX(4px);color:var(--ink)}
.dash{display:grid;grid-template-columns:minmax(160px,1.4fr) repeat(4,minmax(0,1fr));gap:18px;align-items:center}
.dash .pr{display:grid;gap:6px}
.dash .pr .lab{font-size:13px;color:var(--muted)}
.dash .pr .lab b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.kv{display:grid;gap:2px;border-left:1px solid var(--line);padding-left:14px}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.kv small{font-size:12px;color:var(--muted);line-height:1.25}
.kv.alert b{color:var(--warn)}
.nodata{font-size:14px;color:var(--muted)}
@media (max-width:860px){.tile{grid-template-columns:minmax(0,1fr) 20px;gap:14px}.tile .dash,.tile .nodata{grid-column:1/-1;grid-row:2}.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.dash .pr{grid-column:1/-1}.kv{border-left:0;padding-left:0}}

/* project sheet */
.back{justify-self:start;color:var(--muted);font-size:14px;text-decoration:none}
.back:hover{color:var(--ink)}
.ph{display:grid;gap:6px}
.ph h2{font-family:var(--f-display);font-size:clamp(32px,6vw,52px);line-height:1;margin:0;text-wrap:balance}
.ph .loc{color:var(--muted)}
.seg.main a{padding:9px 22px;border-radius:7px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}
.seg.main a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg{display:flex;gap:4px;background:var(--track);padding:4px;border-radius:10px;justify-self:start;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 18px;border-radius:7px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel{display:grid;gap:18px}
.hint{color:var(--muted);font-size:14px;margin:0}
.empty{padding:48px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);background:var(--paper)}

/* overall progress */
.big{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline}
.big b{font-family:var(--f-display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.bar{display:flex;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* month strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;align-items:flex-end}
.mon{flex:1 0 58px;display:grid;gap:6px;justify-items:center;border:1px solid transparent;background:none;border-radius:8px;padding:8px 4px}
.mon:hover{background:var(--paper)}
.mon[aria-pressed="true"]{background:var(--paper);border-color:var(--ink)}
.mon .n{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.mon .col{width:26px;height:120px;display:flex;flex-direction:column-reverse;background:var(--track);border-radius:4px;overflow:hidden}
.mon .col i{display:block;width:100%}
.mon .m{font-size:12px;color:var(--muted);line-height:1.2;text-align:center}
.mon.now .m{color:var(--accent);font-weight:600}

/* lists */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;font-size:13px}
.chip small{color:var(--muted);margin-left:4px;font-family:var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
input[type=search]{font-size:14px;padding:8px 12px;border:1px solid var(--line);background:var(--paper);border-radius:8px;width:min(280px,100%)}
.count{font-size:13px;color:var(--muted)}
.list{display:grid;border:1px solid var(--line);background:var(--paper)}
.gh{padding:8px 16px;background:var(--bg);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.list > :last-child{border-bottom:0}
.row .t{min-width:0}
.row .t div{font-size:14px}
.row .t small{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.row .d{font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .d small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%}
.c-rel{background:var(--accent)}.c-late{background:var(--warn)}.c-client{background:var(--warn);opacity:.45}.c-due{background:var(--due)}
.row.late .d{color:var(--warn)}
.more{border:0;background:none;padding:12px;color:var(--accent);font-weight:500}

/* team */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.team h3{font-family:var(--f-display);font-size:19px;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.team h3 small{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:400}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.trow .w{font-size:12.5px;color:var(--warn);text-align:right}
@media (max-width:520px){.row{grid-template-columns:12px minmax(0,1fr)}.row .d{grid-column:2;text-align:left}}
@media (prefers-reduced-motion:reduce){.tile,.tile .go{transition:none}}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY = new Date().toISOString().slice(0,10), CUR = TODAY.slice(0,7);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v||"");
const fmt = v => isDate(v) ? `${+v.slice(8)} ${MON[+v.slice(5,7)-1]} ${v.slice(0,4)}` : (v||"No date");
const LAB = {rel:"Released", late:"Past GFC date", client:"Pending from client", due:"Not released"};
const COL = {rel:"var(--accent)", late:"var(--warn)", client:"var(--warn)", due:"var(--due)"};
const ON = a => /on board/i.test(a.s);
function cat(d){
  if (/released|issued|approved|received/i.test(d.s) && !/not released/i.test(d.s)) return "rel";
  if (/client/i.test(d.s)) return "client";
  return isDate(d.dt) && d.dt < TODAY ? "late" : "due";
}

PROJECTS.forEach(p => p.group = Object.keys(PLAN).find(g => PLAN[g].includes(p.id)) || "current");
const ORDER = Object.values(PLAN).flat();
PROJECTS.sort((a,b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));
function acat(x){
  if(/pending/i.test(x.s)&&!/amendment|balance/i.test(x.s)) return "pending";
  if(/amendment|awaited|balance|process/i.test(x.s)) return "progress";
  return "done";
}

        <span class="n">${L.length||""}</span>
        <span class="col">${parts.map(([c,v])=>v?`<i style="height:${v/max*100}%;background:${COL[c]};${c==="client"?"opacity:.45":""}"></i>`:"").join("")}</span>
        <span class="m">${MON[+k.slice(5)-1]}<br>${k.slice(2,4)}</span></button>`}).join("")}</div>
    <div id="mlist"></div>`;
  P.querySelectorAll(".mon").forEach(b=>b.onclick=()=>{ui.month=b.dataset.m;P.querySelectorAll(".mon").forEach(x=>x.setAttribute("aria-pressed",x===b));renderMonth()});
  const renderMonth=()=>{const L=by(ui.month).sort((a,b)=>a.dt<b.dt?-1:1);
    $("#mlist").innerHTML=`<div class="tools"><h3 style="font-family:var(--f-display);font-size:20px;margin:0">${MON[+ui.month.slice(5)-1]} ${ui.month.slice(0,4)}</h3><span class="count">${L.length} drawings</span></div>
      <div style="height:10px"></div>${list(L)}`};
  if(months.length) renderMonth();
}

function list(L,limit){
  if(!L.length) return `<div class="empty">No drawings match.</div>`;
  let h="",last="";const show=limit?L.slice(0,limit):L;
  show.forEach(d=>{const g=d.d+(d.g?" · "+d.g:"");if(g!==last){h+=`<div class="gh">${esc(g)}</div>`;last=g}
    h+=`<div class="row ${d.c==="late"?"late":""}"><span class="dot c-${d.c}" title="${LAB[d.c]}"></span><div class="t"><div>${esc(d.t)}</div>${d.n?`<small>${esc(d.n)}</small>`:""}</div><div class="d">${fmt(d.dt)}<small>${esc(d.c==="late"?LAB.late:(d.s||LAB[d.c]))}</small></div></div>`});
  if(limit&&L.length>limit) h+=`<button class="more" id="more">Show ${Math.min(60,L.length-limit)} more</button>`;
  return `<div class="list">${h}</div>`;
}

function tabDrawings(p){
  const P=$("#panel"), D=p.drawings;
  if(!D.length){P.innerHTML=noData("drawings");return}
  const discs=[...new Set(D.map(d=>d.d))];
  P.innerHTML=`<div class="chips" id="dchips">${[["all","All",D.length],...discs.map(x=>[x,x,D.filter(d=>d.d===x).length])].map(([k,l,c])=>`<button class="chip" data-v="${esc(k)}" aria-pressed="${ui.disc===k}">${esc(l)}<small>${c}</small></button>`).join("")}</div>
    <div class="tools"><div class="chips" id="schips">${[["all","All"],["rel","Released"],["due","Not released"],["late","Past GFC"],["client","Pending from client"]].map(([k,l])=>`<button class="chip" data-v="${k}" aria-pressed="${ui.stat===k}">${l}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Search drawings" aria-label="Search drawings" value="${esc(ui.q)}"></div>
    <span class="count" id="cnt"></span><div id="dlist"></div>`;
  const draw=()=>{const q=ui.q.toLowerCase();
    const L=D.filter(d=>(ui.disc==="all"||d.d===ui.disc)&&(ui.stat==="all"||d.c===ui.stat)&&(!q||(d.t+" "+d.n).toLowerCase().includes(q)));
    $("#cnt").textContent=`${L.length} drawings`;$("#dlist").innerHTML=list(L,ui.limit);
    const m=$("#more");if(m)m.onclick=()=>{ui.limit+=60;draw()}};
  const wire=(id,key)=>P.querySelectorAll(`#${id} .chip`).forEach(b=>b.onclick=()=>{ui[key]=b.dataset.v;ui.limit=60;P.querySelectorAll(`#${id} .chip`).forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  wire("dchips","disc");wire("schips","stat");
  $("#q").oninput=e=>{ui.q=e.target.value;ui.limit=60;draw()};
  draw();
}

function viewApprovals(){
  const AP=PROJECTS.filter(p=>p.approvals.length);
  if(!ui.ap||!AP.some(p=>p.id===ui.ap)) ui.ap=AP[0]?.id;
  $("#view").innerHTML=`<div style="display:grid;gap:22px">
    <div class="ph"><h2>Approvals</h2><div class="loc">Permissions and clearances for each project</div></div>
    ${AP.length?`<div class="chips" id="pchips">${AP.map(p=>`<button class="chip" data-v="${p.id}" aria-pressed="${ui.ap===p.id}">${esc(p.name)}<small>${p.approvals.filter(x=>x.c==="done").length}/${p.approvals.length}</small></button>`).join("")}</div>
    <h3 id="aptitle" style="font-family:var(--f-display);font-size:24px;margin:0"></h3>
    <div class="panel" id="panel"></div>`:`<div class="empty">No approvals added yet.</div>`}</div>`;
  const show=()=>{const p=PROJECTS.find(x=>x.id===ui.ap);$("#aptitle").textContent=p.name+(p.approvalsTitle?" · "+p.approvalsTitle:"");ui.af="all";tabApprovals(p)};
  document.querySelectorAll("#pchips .chip").forEach(b=>b.onclick=()=>{ui.ap=b.dataset.v;document.querySelectorAll("#pchips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));show()});
  if(AP.length) show();
}

function tabApprovals(p){
  const P=$("#panel"), A=p.approvals;
  if(!A.length){P.innerHTML=noData("approvals");return}
  const n=k=>A.filter(x=>x.c===k).length;
  const days=d=>Math.round((new Date(d)-new Date(TODAY))/864e5);
  ui.af ??= "all";
  P.innerHTML=`
    <div class="big"><div><b>${n("done")}</b> <span>of ${A.length} ${esc((p.approvalsTitle||"approvals").toLowerCase())} done</span></div>${n("progress")?`<div><b style="color:var(--info)">${n("progress")}</b> <span>in progress</span></div>`:""}${n("pending")?`<div><b style="color:var(--warn)">${n("pending")}</b> <span>not started</span></div>`:""}</div>
    <div class="bar">${["done","progress"].map(k=>`<i style="width:${n(k)/A.length*100}%;background:${ACOL[k]}"></i>`).join("")}</div>
    <div class="chips" id="achips">${[["all","All"],["done","Done"],["progress","In progress"],["pending","Not started"]].map(([k,l])=>`<button class="chip" data-v="${k}" aria-pressed="${ui.af===k}">${l}<small>${k==="all"?A.length:n(k)}</small></button>`).join("")}</div>
    <div id="alist"></div>
    ${p.approvalsNote?`<p class="hint">${esc(p.approvalsNote)}</p>`:""}`;
  const draw=()=>{const L=A.filter(x=>ui.af==="all"||x.c===ui.af);
    $("#alist").innerHTML=L.length?`<div class="list">${L.map(x=>{
      let when="";if(isDate(x.dt)){if(x.target&&x.c!=="done"){const d=days(x.dt);when=`Target ${fmt(x.dt)}<small style="${d<0?"color:var(--warn)":""}">${d<0?Math.abs(d)+" days overdue":d===0?"Today":d+" days left"}</small>`}else when=`${fmt(x.dt)}<small>${ALAB[x.c]}</small>`}else when=`–<small>${ALAB[x.c]}</small>`;
      return `<div class="row"><span class="dot" style="background:${ACOL[x.c]}"></span><div class="t"><div>${esc(x.a)}</div><small style="font-family:var(--f-body);font-size:13px">${esc(x.s)}</small></div><div class="d">${when}</div></div>`}).join("")}</div>`:`<div class="empty">Nothing in this group.</div>`};
  P.querySelectorAll("#achips .chip").forEach(b=>b.onclick=()=>{ui.af=b.dataset.v;P.querySelectorAll("#achips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});
  draw();
}

function tabTeam(p){
  const P=$("#panel"), T=p.team;
  if(!T.length){P.innerHTML=noData("consultants");return}
  const need=T.filter(a=>!ON(a)), on=T.filter(ON);
  const block=(title,L,showWhen)=>L.length?`<section><h3>${title}<small>${L.length}</small></h3><div class="list">${L.map(a=>`<div class="trow"><span>${esc(a.r)}</span>${showWhen?`<span class="w">${esc(isDate(a.when)?"By "+fmt(a.when):a.when||"")}</span>`:`<span class="dot c-rel" style="align-self:center"></span>`}</div>`).join("")}</div></section>`:"";
  P.innerHTML=`<div class="team">${block("To appoint",need,true)}${block("On board",on,false)}</div>`;
}

function route(){
  const h=location.hash.slice(1);
  const p=h.startsWith("p-")&&PROJECTS.find(x=>x.id===h.slice(2));
  document.querySelectorAll(".seg.main a").forEach(a=>{(h==="approvals")===(a.dataset.n==="approvals")?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  Object.assign(ui,{tab:"timeline",month:null,disc:"all",stat:"all",q:"",limit:60,af:"all"});
  p?viewProject(p):h==="approvals"?viewApprovals():viewHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>

</body>
</html>
